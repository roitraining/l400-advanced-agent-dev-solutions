[project]
name = "challenge-2"
version = "0.1.0"
description = "Challenge 2 ADK agent: Aurora Bay chat with private search and Google Search"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk[gcp]>=2.0.0,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aurora_bay_chat"]
